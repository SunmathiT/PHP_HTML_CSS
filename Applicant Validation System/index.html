<html>
<head>
    <title>Applicant Validation System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

<h1>Applicant Validation System</h1>

<form action="validate.php" method="post">

<div class="field">
<label for="email">Email ID</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>
</div>

<div class="field">
<label for="password">Password</label>
<input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
</div>

<div class="field">
<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" name="mobile" maxlength="10" placeholder="10-digit number" required>
</div>

<button type="submit">Validate Details</button>

</form>

</div>

</body>
</html>

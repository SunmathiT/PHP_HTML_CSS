<html>
<head>
    <title>Workshop Registration System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h2>Workshop Registration Form</h2>

    <form action="register.php" method="POST">

        <label for="name">Participant Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="Enter 10-digit mobile number" required>

        <label for="workshop">Select Workshop</label>
        <select id="workshop" name="workshop" required>
            <option value="">-- Select Workshop --</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="Cyber Security">Cyber Security</option>
            <option value="UI/UX Design">UI/UX Design</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
        </select>

        <label>Attendance Mode</label>

        <div class="radio">
            <label><input type="radio" name="mode" value="In-Person" required> In-Person</label>
            <label><input type="radio" name="mode" value="Virtual"> Virtual</label>
        </div>

        <input type="submit" value="Register">

    </form>

</div>

</body>
</html>

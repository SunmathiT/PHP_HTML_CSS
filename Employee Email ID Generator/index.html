<html>
<head>
    <title>Staff Email ID Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Staff Email ID Generator</h2>

<form action="generate.php" method="post">

<label>Full Name</label>
<input type="text" name="name" placeholder="e.g. Sundar Pichai" required>

<label>Employee ID</label>
<input type="text" name="empid" placeholder="e.g. 1024" required>

<label>Company Domain</label>
<input type="text" name="domain" placeholder="example.com" required>

<input type="submit" value="Generate Email">

</form>

</div>

</body>
</html>

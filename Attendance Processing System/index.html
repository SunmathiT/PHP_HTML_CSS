<html>
<head>
    <title>Attendance Processing System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

<h1>Attendance Processing System</h1>

<form action="attendance.php" method="post">

<div class="field">
<label for="name">Student Name</label>
<input type="text" id="name" name="name" placeholder="Enter student name" required>
</div>

<div class="field">
<label for="working">Total Working Days</label>
<input type="number" id="working" name="working" min="1" placeholder="e.g. 120" required>
</div>

<div class="field">
<label for="present">Days Present</label>
<input type="number" id="present" name="present" min="0" placeholder="e.g. 100" required>
</div>

<button type="submit">Calculate Attendance</button>

</form>

</div>

</body>
</html>

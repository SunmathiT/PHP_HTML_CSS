<html>
<head>
    <title>Insurance Premium Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h2>Insurance Premium Calculator</h2>

<form action="premium.php" method="post">

<label>Policy Holder Name</label>
<input type="text" name="name" required>

<label>Age</label>
<input type="number" name="age" min="18" max="100" required>

<label>Policy Term (Years)</label>
<input type="number" name="term" min="1" required>

<label>Coverage Amount (₹)</label>
<input type="number" name="coverage" min="10000" required>

<input type="submit" value="Calculate Premium">

</form>

</div>

</body>
</html>
